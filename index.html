<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Fruit Merge</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            touch-action: none;
        }
        h1 { margin: 5px 0; font-size: 20px; }
        .hud {
            width: min(100%, 450px, calc((100vh - 150px) * 450 / 640)); background: #34495e; padding: 8px 12px;
            border-radius: 8px 8px 0 0; box-sizing: border-box; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center; font-size: 16px;
        }
        .modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 6px; }
        .mode-btn {
            padding: 6px 12px; border-radius: 16px; background: #1a252f; color: white;
            text-decoration: none; font-weight: bold; font-size: 14px; opacity: 0.6;
        }
        .mode-btn.active { opacity: 1; background: #27ae60; }
        #btn-size.active { background: #8e44ad; }
        #next-img { width: 34px; height: 34px; vertical-align: middle; }
        .game-board {
            position: relative;
            /* fit the screen height too, keeping the 450x640 shape */
            width: min(100%, 450px, calc((100vh - 150px) * 450 / 640));
            aspect-ratio: 450/640;
            border: 6px solid #34495e;
            box-sizing: border-box;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }
        /* Fail line: DANGER_Y / GAME_HEIGHT = 150 / 640 */
        .danger-line {
            position: absolute; top: 23.4375%; width: 100%;
            border-top: 3px dashed rgba(231, 76, 60, 0.8); pointer-events: none; z-index: 10;
        }
        #drop-guide {
            position: absolute; top: 0; left: 50%; aspect-ratio: 1;
            transform: translateX(-50%);
            background: center/contain no-repeat;
            opacity: 0.6; pointer-events: none; z-index: 11;
        }
        #gameover {
            position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 200;
            text-align: center;
        }
        #gameover button {
            margin-top: 12px; background: #27ae60; color: white; border: none; padding: 12px 24px;
            border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        #ad-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
            flex-direction: column; justify-content: center; align-items: center; z-index: 300;
        }
        #ad-box {
            width: min(90vw, 360px); aspect-ratio: 3/4; background: linear-gradient(160deg, #f9e79f, #f5b041);
            border-radius: 12px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; color: #2c3e50; text-align: center; padding: 20px; box-sizing: border-box;
        }
        #ad-close {
            margin-top: 14px; background: #7f8c8d; color: white; border: none; padding: 10px 22px;
            border-radius: 20px; font-size: 15px; font-weight: bold;
        }
        #ad-close:enabled { background: #e74c3c; cursor: pointer; }
    </style>
    <!-- Include Matter.js for 2D Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <h1><img src="assets/farm/00_seed_bag.png" alt="" style="height: 26px; vertical-align: middle;"> Happy Fruit Merge</h1>

    <div class="modes">
        <a class="mode-btn" data-mode="fruit" href="?mode=fruit">🍓 Fruit</a>
        <a class="mode-btn" data-mode="animal" href="?mode=animal">🐷 Animals</a>
        <a class="mode-btn" data-mode="cars" href="?mode=cars">🚗 Cars</a>
        <a id="btn-size" class="mode-btn" href="?size=reverse" title="Reverse size: higher levels are smaller">↕️ Reverse</a>
    </div>

    <div class="hud">
        <div>⭐ <span id="score-val">0</span></div>
        <div style="color: #f39c12;">🏆 <span id="best-val">0</span></div>
        <div>Next <img id="next-img" alt=""></div>
    </div>

    <div id="board" class="game-board">
        <div id="drop-guide"></div>
        <div class="danger-line"></div>
    </div>

    <div id="gameover">
        <h2 style="margin: 0;">Game Over</h2>
        <div id="gameover-text"></div>
        <button id="btn-restart">Play Again</button>
    </div>

    <!-- Ad break. Replaced by a real ad when an ad network is configured (see ads.js / README) -->
    <div id="ad-overlay">
        <div style="font-size: 12px; opacity: 0.7; margin-bottom: 6px;">Advertisement</div>
        <div id="ad-box">
            <img src="assets/farm/11_sunflower.png" alt="" style="width: 45%;">
            <h2 style="margin: 10px 0 4px;">Your ad here</h2>
            <div style="font-size: 14px;">Ad placeholder until an ad network is connected.</div>
        </div>
        <button id="ad-close" disabled>Close in 5</button>
    </div>

    <script src="shapes.js"></script>
    <script src="ads.js"></script>
    <script src="game.js"></script>
</body>
</html>
