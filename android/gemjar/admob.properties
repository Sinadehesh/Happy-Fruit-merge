# Your AdMob IDs for Gem Jar (AdMob > Apps > Gem Jar). These are not secret: they ship inside the app.
# app_id: App settings > App ID, looks like ca-app-pub-1234567890123456~1234567890
# interstitial_id: the full-screen ad shown between games, looks like ca-app-pub-1234567890123456/1234567890
# banner_id: the banner under the game (Banner ad unit), same format
# rewarded_id: "watch an ad to keep going" when the jar fills up (Rewarded ad unit), same format
# While these are empty the app is built with Google's test ads, and only as a TEST-ADS APK (no Play bundle).
app_id=
interstitial_id=
banner_id=
rewarded_id=
