# Your AdMob IDs for Zombie Bomber (AdMob > Apps > Zombie Bomber). These are not secret: they ship inside the app.
# app_id: App settings > App ID, looks like ca-app-pub-1234567890123456~1234567890
# The ad units (each looks like ca-app-pub-1234567890123456/1234567890):
# banner_id:          Banner, across the top of the screen
# interstitial_id:    Interstitial, between levels when PLAY is pressed (from level 4, at most once every 2.5 minutes)
# rewarded_revive_id: Rewarded, "repair the base" when it falls (once a level)
# rewarded_double_id: Rewarded, "x2 coins" on the level cleared screen
# rewarded_coins_id:  Rewarded, free coins in the upgrade shop (once a visit)
# rewarded_boost_id:  Rewarded, "head start": the next level begins with a big bomb in the bay
# While any of these is empty the app is built with Google's test ads, and only as a TEST-ADS APK (no Play bundle).
app_id=
