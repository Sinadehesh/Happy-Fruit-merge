<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Bomber</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #0f0c1d;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 40%, #2a1840 0%, #0f0c1d 70%);
        }
        canvas {
            display: block;
            touch-action: none;
        }
        /* on wide screens the game is a column in the middle */
        @media (min-aspect-ratio: 3/4) {
            canvas {
                border-radius: 12px;
                box-shadow: 0 0 60px rgba(255, 120, 40, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.06);
            }
        }
    </style>
    <!-- Matter.js for the bomb bay physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <canvas id="game"></canvas>
    <script src="shapes.js"></script>
    <script src="ads.js"></script>
    <script src="bomber.js"></script>
</body>
</html>
